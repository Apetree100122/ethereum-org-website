name: APIsec Scan

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev", "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  apisec-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Example: Install APIsec scanner (replace with actual tool as needed)
      - name: Install APIsec Scanner
        run: |
          python -m pip install --upgrade pip
          pip install apisec-cli

      # Example: Run the scan (replace with actual scan command and config)
      - name: Run APIsec Scan
        env:
          APISEC_TOKEN: ${{ secrets.APISEC_TOKEN }}  # Store sensitive tokens in GitHub secrets!
        run: |
          apisec scan --token $APISEC_TOKEN --target-url https://your-api-endpoint.com

      # Example: Upload SARIF report to GitHub Security tab (if supported by your scanner)
      - name: Upload SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif  # Replace with the actual SARIF path/output from your tool
